<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>md2docx</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #0d0d0d;
      --surface: #161616;
      --border:  #272727;
      --accent:  #00d4ff;
      --text:    #e8e8e8;
      --muted:   #555;
      --green:   #22c55e;
      --red:     #ef4444;
      --yellow:  #f59e0b;
      --radius:  12px;
    }
    html, body {
      height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 15px; -webkit-user-select: none; user-select: none;
    }
    body { display: flex; flex-direction: column; align-items: center; padding: 40px 20px 80px; }

    /* header */
    header { text-align: center; margin-bottom: 32px; }
    header h1 { font-size: 24px; font-weight: 700; color: var(--accent); letter-spacing: -0.5px; }
    header p  { margin-top: 5px; color: var(--muted); font-size: 13px; }
    #pandoc-badge {
      display: inline-block; margin-top: 9px; font-size: 11px;
      color: var(--muted); background: var(--surface);
      border: 1px solid var(--border); border-radius: 20px; padding: 3px 10px;
    }
    #pandoc-badge.ok  { border-color: var(--green); color: var(--green); }
    #pandoc-badge.bad { border-color: var(--red);   color: var(--red); }

    /* warning */
    #dep-warning {
      display: none; width: 100%; max-width: 560px;
      background: #1a1200; border: 1px solid var(--yellow);
      border-radius: var(--radius); padding: 14px 18px; margin-bottom: 20px;
      font-size: 13px; color: var(--yellow); line-height: 1.6;
    }
    #dep-warning code { background: #2a2000; padding: 2px 7px; border-radius: 4px; font-family: monospace; }

    /* pick area */
    #pick-area {
      width: 100%; max-width: 560px;
      border: 2px dashed var(--border); border-radius: var(--radius);
      padding: 36px 24px; text-align: center;
      transition: border-color .2s, background .2s;
    }
    #pick-area.over { border-color: var(--accent); background: rgba(0,212,255,.04); }
    .pick-icon  { font-size: 34px; margin-bottom: 10px; display: block; }
    .pick-title { font-size: 15px; font-weight: 600; }
    .pick-sub   { margin-top: 5px; font-size: 12px; color: var(--muted); }
    #browse-btn {
      margin-top: 16px; background: var(--surface);
      color: var(--accent); border: 1px solid var(--accent);
      border-radius: 8px; padding: 9px 22px; font-size: 13px;
      font-weight: 600; cursor: pointer; transition: background .15s;
    }
    #browse-btn:hover { background: rgba(0,212,255,.08); }

    /* ref doc */
    #ref-wrap { width: 100%; max-width: 560px; margin-top: 10px; }
    #ref-btn {
      width: 100%; display: flex; align-items: center; gap: 10px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 14px; cursor: pointer;
      font-size: 13px; color: var(--muted); text-align: left;
      transition: border-color .2s, color .2s;
    }
    #ref-btn:hover { border-color: var(--accent); color: var(--text); }
    #ref-btn.active { border-color: var(--accent); color: var(--text); }
    #ref-name { flex: 1; }
    #ref-clear {
      color: var(--red); font-size: 12px; cursor: pointer;
      background: none; border: none; padding: 0;
    }

    /* file list */
    #file-list { width: 100%; max-width: 560px; margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }

    .file-row {
      display: flex; align-items: center; gap: 12px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 14px; transition: border-color .2s;
    }
    .file-row.done   { border-color: var(--green); }
    .file-row.error  { border-color: var(--red); }
    .file-row.active { border-color: var(--accent); }

    .file-icon { font-size: 18px; flex-shrink: 0; }
    .file-name { flex: 1; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-status { flex-shrink: 0; font-size: 13px; color: var(--muted); }
    .file-row.done  .file-status { color: var(--green); }
    .file-row.error .file-status { color: var(--red); }
    .file-row.active .file-status { color: var(--accent); }

    .save-btn {
      flex-shrink: 0; background: var(--green); color: #000;
      border: none; border-radius: 6px; padding: 5px 12px;
      font-size: 12px; font-weight: 600; cursor: pointer;
      transition: opacity .15s;
    }
    .save-btn:hover { opacity: .85; }
    .remove-btn {
      flex-shrink: 0; background: none; border: none; color: var(--muted);
      cursor: pointer; font-size: 16px; line-height: 1; padding: 2px 4px;
      border-radius: 4px; transition: color .15s;
    }
    .remove-btn:hover { color: var(--red); }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 14px; height: 14px; border: 2px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin .7s linear infinite; flex-shrink: 0;
    }

    /* actions */
    #actions { width: 100%; max-width: 560px; margin-top: 14px; display: flex; gap: 10px; }
    #convert-btn {
      flex: 1; background: var(--accent); color: #000; border: none;
      border-radius: 8px; padding: 13px 20px; font-size: 15px; font-weight: 700;
      cursor: pointer; transition: opacity .15s;
    }
    #convert-btn:hover:not(:disabled) { opacity: .88; }
    #convert-btn:disabled { opacity: .3; cursor: not-allowed; }
    #clear-btn {
      background: var(--surface); color: var(--muted); border: 1px solid var(--border);
      border-radius: 8px; padding: 13px 16px; font-size: 14px; cursor: pointer;
      transition: color .15s, border-color .15s;
    }
    #clear-btn:hover { color: var(--text); border-color: var(--muted); }

    /* save all */
    #save-all-btn {
      display: none; width: 100%; max-width: 560px; margin-top: 10px;
      background: var(--surface); color: var(--green);
      border: 1px solid var(--green); border-radius: 8px;
      padding: 11px; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: background .15s;
    }
    #save-all-btn:hover { background: rgba(34,197,94,.08); }

    footer {
      position: fixed; bottom: 0; left: 0; right: 0; text-align: center;
      padding: 10px; font-size: 12px; color: var(--muted);
      background: var(--bg); border-top: 1px solid var(--border);
    }
    footer span { color: var(--accent); }
  </style>
</head>
<body>

<header>
  <h1>md2docx</h1>
  <p>Convert Markdown to Word — locally, no cloud.</p>
  <div id="pandoc-badge">checking…</div>
</header>

<div id="dep-warning"></div>

<div id="pick-area">
  <span class="pick-icon">📝</span>
  <div class="pick-title">Select your Markdown files</div>
  <div class="pick-sub">Or drag & drop .md files here</div>
  <button id="browse-btn">Browse Files…</button>
</div>

<div id="ref-wrap">
  <button id="ref-btn">
    <span>📎</span>
    <span id="ref-name">Optional: add a reference .docx to use its Word styles</span>
    <button id="ref-clear" style="display:none" onclick="clearRef(event)">✕ remove</button>
  </button>
</div>

<div id="file-list"></div>

<div id="actions" style="display:none">
  <button id="convert-btn">Convert to DOCX</button>
  <button id="clear-btn">Clear</button>
</div>

<button id="save-all-btn">Save All DOCX Files…</button>

<footer>Fully local · powered by <span>Pandoc</span> · close this window to quit</footer>

<script>
  let filePaths = [];   // string paths from native picker
  let refDocPath = '';
  let converting = false;
  let pendingSaves = []; // [{token, name}]

  // ── pandoc check ────────────────────────────────────────────────────────────
  (async () => {
    const badge = document.getElementById('pandoc-badge');
    try {
      const d = await (await fetch('/check')).json();
      if (d.ok) {
        badge.textContent = `pandoc ${d.version}`;
        badge.className = 'ok';
      } else {
        badge.textContent = 'pandoc not found';
        badge.className = 'bad';
        const warn = document.getElementById('dep-warning');
        warn.style.display = 'block';
        warn.innerHTML = `<strong>⚠ Pandoc not installed</strong><br>Install it then reopen this app:<br><code>${esc(d.hint)}</code>`;
      }
    } catch { badge.textContent = '?'; }
  })();

  // ── native file picker ───────────────────────────────────────────────────────
  document.getElementById('browse-btn').addEventListener('click', async () => {
    if (converting) return;
    const paths = await window.pickFiles().catch(() => null);
    if (!paths || paths.length === 0) return;
    addPaths(paths);
  });

  function addPaths(newPaths) {
    const existing = new Set(filePaths);
    newPaths.forEach(p => { if (!existing.has(p)) filePaths.push(p); });
    render();
  }

  // ── drag and drop (reads file content, uploads to server) ───────────────────
  const pickArea = document.getElementById('pick-area');
  pickArea.addEventListener('dragover',  e => { e.preventDefault(); pickArea.classList.add('over'); });
  pickArea.addEventListener('dragleave', () => pickArea.classList.remove('over'));
  pickArea.addEventListener('drop', async e => {
    e.preventDefault();
    pickArea.classList.remove('over');
    const dropped = [...e.dataTransfer.files].filter(f => f.name.match(/\.(md|markdown)$/i));
    if (dropped.length === 0) return;
    // Store as sentinel paths — real upload happens at convert time
    dropped.forEach(f => {
      if (!filePaths.includes('\x00drop:' + f.name)) {
        filePaths.push('\x00drop:' + f.name);
        // stash the actual File object
        dropFiles['\x00drop:' + f.name] = f;
      }
    });
    render();
  });
  const dropFiles = {};

  // ── ref doc picker ───────────────────────────────────────────────────────────
  document.getElementById('ref-btn').addEventListener('click', async e => {
    if (e.target.id === 'ref-clear' || converting) return;
    const path = await window.pickRefDoc().catch(() => '');
    if (!path) return;
    refDocPath = path;
    const name = path.split('/').pop();
    document.getElementById('ref-name').textContent = '📄 ' + name;
    document.getElementById('ref-btn').classList.add('active');
    document.getElementById('ref-clear').style.display = '';
  });

  function clearRef(e) {
    e.stopPropagation();
    refDocPath = '';
    document.getElementById('ref-name').textContent = 'Optional: add a reference .docx to use its Word styles';
    document.getElementById('ref-btn').classList.remove('active');
    document.getElementById('ref-clear').style.display = 'none';
  }

  // ── render ───────────────────────────────────────────────────────────────────
  function render() {
    const list = document.getElementById('file-list');
    list.innerHTML = '';
    pendingSaves = [];

    filePaths.forEach((p, i) => {
      const name = p.startsWith('\x00drop:') ? p.slice(6) : p.split('/').pop();
      const row = document.createElement('div');
      row.className = 'file-row';
      row.id = `row-${i}`;
      row.innerHTML = `
        <span class="file-icon">📝</span>
        <span class="file-name" title="${esc(p)}">${esc(name)}</span>
        <span class="file-status" id="status-${i}">ready</span>
        <button class="remove-btn" onclick="removePath(${i})">✕</button>`;
      list.appendChild(row);
    });

    document.getElementById('actions').style.display = filePaths.length ? 'flex' : 'none';
    document.getElementById('convert-btn').disabled = converting || filePaths.length === 0;
    document.getElementById('save-all-btn').style.display = 'none';
  }

  function removePath(i) {
    if (converting) return;
    const p = filePaths[i];
    if (dropFiles[p]) delete dropFiles[p];
    filePaths.splice(i, 1);
    render();
  }

  // ── convert ──────────────────────────────────────────────────────────────────
  document.getElementById('convert-btn').addEventListener('click', startConvert);
  document.getElementById('clear-btn').addEventListener('click', () => {
    if (converting) return;
    filePaths = []; Object.keys(dropFiles).forEach(k => delete dropFiles[k]);
    render();
  });

  async function startConvert() {
    if (converting || filePaths.length === 0) return;
    converting = true; pendingSaves = [];
    document.getElementById('convert-btn').disabled = true;
    document.getElementById('clear-btn').disabled = true;
    document.getElementById('save-all-btn').style.display = 'none';
    filePaths.forEach((_, i) => setStatus(i, 'queued', '—'));

    // Separate native paths from dropped File objects
    const nativePaths = filePaths.filter(p => !p.startsWith('\x00drop:'));
    const droppedKeys  = filePaths.filter(p =>  p.startsWith('\x00drop:'));

    let jobId;

    if (droppedKeys.length > 0 && nativePaths.length === 0) {
      // All files were drag-dropped — upload via FormData
      const form = new FormData();
      droppedKeys.forEach(k => form.append('files', dropFiles[k]));
      // ref doc: if it's a path, can't easily upload it — skip for now
      try {
        const res = await fetch('/upload-by-path', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ paths: [], refDoc: refDocPath }),
        });
        // fallback: use form upload for drop files via a temp endpoint
        // For now just show a helpful message
        alert('Drag & drop requires the native file picker in the app. Please use "Browse Files…" to select your files.');
        converting = false;
        document.getElementById('clear-btn').disabled = false;
        render();
        return;
      } catch {}
    }

    // Native paths → upload-by-path
    if (nativePaths.length === 0) {
      converting = false;
      document.getElementById('clear-btn').disabled = false;
      render();
      return;
    }

    try {
      const res = await fetch('/upload-by-path', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ paths: nativePaths, refDoc: refDocPath }),
      });
      if (!res.ok) throw new Error(await res.text());
      ({ jobId } = await res.json());
    } catch (err) {
      alert('Failed to start conversion: ' + err.message);
      converting = false; render(); return;
    }

    // Map path → row index (only native paths)
    const nameToIdx = {};
    filePaths.forEach((p, i) => {
      const name = p.startsWith('\x00drop:') ? p.slice(6) : p.split('/').pop();
      nameToIdx[name] = i;
    });

    let fileIdx = 0;
    setStatus(0, 'active', ''); addSpinner(0);

    const es = new EventSource(`/events?job=${jobId}`);

    es.onmessage = e => {
      const msg = JSON.parse(e.data);

      if (msg.type === 'fatal') {
        es.close(); alert(msg.message);
        converting = false;
        document.getElementById('clear-btn').disabled = false;
        document.getElementById('convert-btn').disabled = false;
        return;
      }
      if (msg.type === 'converted') {
        const idx = nameToIdx[msg.file] ?? fileIdx;
        setStatus(idx, 'done', '✔');
        addSaveBtn(idx, msg.token, msg.docx);
        pendingSaves.push({ token: msg.token, name: msg.docx });
        fileIdx++;
        if (fileIdx < filePaths.length) { setStatus(fileIdx, 'active', ''); addSpinner(fileIdx); }
      }
      if (msg.type === 'error') {
        const idx = nameToIdx[msg.file] ?? fileIdx;
        setStatus(idx, 'error', msg.error || 'failed');
        fileIdx++;
        if (fileIdx < filePaths.length) { setStatus(fileIdx, 'active', ''); addSpinner(fileIdx); }
      }
      if (msg.type === 'complete') {
        es.close(); converting = false;
        document.getElementById('clear-btn').disabled = false;
        document.getElementById('convert-btn').disabled = filePaths.length === 0;
        if (pendingSaves.length > 1) document.getElementById('save-all-btn').style.display = 'block';
      }
    };
    es.onerror = () => { es.close(); converting = false; document.getElementById('clear-btn').disabled = false; };
  }

  // ── save ─────────────────────────────────────────────────────────────────────
  document.getElementById('save-all-btn').addEventListener('click', async () => {
    for (const { token, name } of pendingSaves) {
      await window.saveFile(token, name).catch(() => {});
    }
  });

  async function triggerSave(token, name) {
    const ok = await window.saveFile(token, name).catch(() => false);
    if (!ok) console.log('Save cancelled or failed');
  }

  // ── helpers ──────────────────────────────────────────────────────────────────
  function setStatus(i, state, text) {
    document.getElementById(`row-${i}`)?.setAttribute('class', 'file-row ' + state);
    const s = document.getElementById(`status-${i}`);
    if (s && text !== undefined) s.textContent = text;
  }
  function addSpinner(i) {
    const s = document.getElementById(`status-${i}`);
    if (s) s.innerHTML = '<div class="spinner"></div>';
  }
  function addSaveBtn(i, token, name) {
    const row = document.getElementById(`row-${i}`);
    if (!row) return;
    row.querySelector('.remove-btn')?.remove();
    const btn = document.createElement('button');
    btn.className = 'save-btn';
    btn.textContent = '⬇ Save DOCX';
    btn.onclick = () => triggerSave(token, name);
    row.appendChild(btn);
  }
  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>
